name: tests
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test BFF
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '>=1.26' ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Run Redis store tests
        working-directory: store/redis
        env:
          BFF_REDIS_ADDR: localhost:6379
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Fuzz smoke
        run: |
          for t in FuzzCookieRead FuzzDecodeSession FuzzLocalURL FuzzVerifyLogoutToken; do
            echo "::group::${t}"
            go test -run '^$' -fuzz="^${t}$" -fuzztime=20s .
            echo "::endgroup::"
          done

      - name: Upload fuzz crashers on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: testdata/fuzz/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: true
          files: ./coverage.txt,./store/redis/coverage.txt
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint BFF
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '>=1.26' ]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run linter
        uses: golangci/golangci-lint-action@v9

      - name: Run Redis store linter
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: store/redis

      - name: Run conformance linter
        uses: golangci/golangci-lint-action@v9
        with:
          working-directory: conformance
